# Streamlit theme — base hue is overridden by the glassmorphism CSS in
# omni/dashboard/theme.py. We set `base = "auto"` so Streamlit follows the
# user's OS dark/light preference; the injected CSS layers cyan/violet
# accents on top of either base.
[theme]
base = "dark"
primaryColor = "#06b6d4"
backgroundColor = "#0b1224"
secondaryBackgroundColor = "#111a30"
textColor = "#e2e8f0"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
runOnSave = true
# Exclude site-packages from the file watcher. Without this, Streamlit's
# local-sources watcher walks every transformers submodule on every
# rerun, which fails-loud on the image/OCR models that need torchvision
# (zoedepth, pp_doclayout_v2/v3, pp_formulanet, pp_lcnet, pp_ocrv5_*).
# We never edit third-party code, so blacklisting them costs nothing.
folderWatchBlacklist = [
    ".venv",
    "venv",
    "site-packages",
    "data",
    "logs",
    "lightning_logs",
]

[client]
showErrorDetails = true
toolbarMode = "minimal"
