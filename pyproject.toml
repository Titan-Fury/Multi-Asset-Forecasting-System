[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-stocks"
version = "0.1.0"
description = "Multi-asset, multi-LLM market prediction system (Indian + US + crypto + FX)"
requires-python = ">=3.11"
authors = [{ name = "Omni_Stocks" }]

dependencies = [
    # Core data
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26,<2.3",
    "scipy>=1.12",

    # Market data
    "yfinance>=0.2.40",
    "nsepython>=2.94",
    "ccxt>=4.3",
    "fredapi>=0.5.2",
    "pandas-ta>=0.3.14b0",

    # ML / models
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "hmmlearn>=0.3",

    # LLMs
    "transformers>=4.44",
    "torch>=2.3",
    "diskcache>=5.6",

    # External APIs
    "snowflake-connector-python>=3.10",
    "snowflake-snowpark-python>=1.20",
    "praw>=7.7",
    "requests>=2.32",
    "httpx>=0.27",

    # Dashboard
    "streamlit>=1.36",
    "plotly>=5.22",

    # Infra
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tenacity>=9.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# API service (FastAPI extraction — Phase 24.16). Install with
#   pip install -e ".[api]"
# when you want to run `python -m omni.api.serve` or scrape /metrics/prom.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]
# RAG layer dependencies. Install with
#   pip install -e ".[rag]"
rag = [
    "qdrant-client>=1.11",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omni*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
