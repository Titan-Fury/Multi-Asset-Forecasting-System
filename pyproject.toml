[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-stocks"
version = "0.1.0"
description = "Multi-asset, multi-LLM market prediction system (Indian + US + crypto + FX)"
requires-python = ">=3.11"
authors = [{ name = "Omni_Stocks" }]

dependencies = [
    # Core data
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "numpy>=1.26,<2.3",
    "scipy>=1.12",

    # Market data
    "yfinance>=0.2.40",
    "nsepython>=2.94",
    "ccxt>=4.3",
    "fredapi>=0.5.2",
    "pandas-ta>=0.3.14b0",

    # ML / models
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "hmmlearn>=0.3",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "river>=0.21",

    # LLMs
    "transformers>=4.44",
    "torch>=2.3",
    "diskcache>=5.6",

    # External APIs
    "snowflake-connector-python>=3.10",
    "snowflake-snowpark-python>=1.20",
    "praw>=7.7",
    "requests>=2.32",
    "httpx>=0.27",
    # Optional: Apify Twitter / X scraping. Only imported when
    # social.twitter.enabled=true in config/sources.yaml AND
    # APIFY_TOKEN is set in the environment.
    "apify-client>=1.7",

    # Dashboard
    "streamlit>=1.36",
    "plotly>=5.22",

    # Infra
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "loguru>=0.7",
    "tenacity>=9.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# API service (FastAPI extraction — Phase 24.16). Install with
#   pip install -e ".[api]"
# when you want to run `python -m omni.api.serve` or scrape /metrics/prom.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "prometheus-client>=0.20",
]
# RAG layer dependencies. Install with
#   pip install -e ".[rag]"
rag = [
    "qdrant-client>=1.11",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "bandit>=1.7",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omni*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enforced rule families: pycodestyle (E/W), pyflakes (F — unused/undefined),
# isort (I), flake8-bugbear (B — real bug patterns), pyupgrade (UP).
select = ["E", "F", "W", "I", "B", "UP"]
# Ignored — incompatible with this codebase's intentional patterns, not bugs:
#   E501  line length is advisory (long f-string log lines / URLs)
#   E402  scripts bootstrap sys.path / warnings.filterwarnings before imports
#   E701/E702  occasional compact one-liners (guard + action)
#   E741  a couple of domain-conventional short names
#   B905  zip() strict= — iterables are known-aligned; strict=True could raise
ignore = ["E501", "E402", "E701", "E702", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
# Intentional unused imports: package re-exports and optional-dependency
# availability probes (imported inside try/except to set a _HAS_* flag).
"**/__init__.py" = ["F401"]
"omni/models/nhits.py" = ["F401"]
"omni/models/patchtst.py" = ["F401"]
"omni/llm/rag/retriever.py" = ["F401"]
"omni/storage/mount.py" = ["F401"]

[tool.bandit]
# Security gate runs `bandit -ll` (medium+high only). These low-severity tests
# are this codebase's intentional patterns, not vulnerabilities:
#   B110/B112  try/except/pass|continue — graceful degradation on flaky feeds
#   B404/B603  subprocess used with arg-lists (shell=False) — no shell injection
#   B101  asserts in non-security helper paths
#   B311  random used for non-cryptographic jitter/sampling
skips = ["B101", "B110", "B112", "B311", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
