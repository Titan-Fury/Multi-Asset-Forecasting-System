# Data source configuration. API keys live in .env (referenced by name).

prices:
  india:
    primary: yfinance
    fallback: nsepython
  us:
    primary: yfinance
    fallback: alpha_vantage
  crypto:
    primary: ccxt
    exchange: binance
    fallback: yfinance
  fx:
    primary: yfinance

fundamentals:
  india:
    primary: yfinance     # Ticker.info
  us:
    primary: yfinance
    fallback: finnhub

news:
  newsapi:
    enabled: true
    key_env: NEWSAPI_KEY
    rate_limit_rpd: 100  # free tier
  rss:
    enabled: true
    feeds:
      - https://feeds.reuters.com/reuters/businessNews
      - https://www.moneycontrol.com/rss/business.xml
      - https://economictimes.indiatimes.com/rssfeedstopstories.cms
      - https://feeds.bloomberg.com/markets/news.rss
      - https://www.cnbc.com/id/10001147/device/rss/rss.html

macro:
  fred:
    key_env: FRED_API_KEY
    series:
      - DGS10        # 10-year Treasury rate
      - DGS2         # 2-year Treasury rate
      - DEXUSEU      # USD/EUR exchange rate
      - DCOILWTICO   # WTI crude oil
      - VIXCLS       # VIX index
      - T10YIE       # 10-year breakeven inflation
      - UNRATE       # US unemployment
      - CPIAUCSL     # US CPI

social:
  reddit:
    enabled: true    # Phase 24.18 — public-JSON scraper, no auth needed.
                     # Module gracefully degrades to empty list on 429/5xx.
    subreddits:
      - wallstreetbets
      - stocks
      - IndianStockMarket
      - IndiaInvestments
      - DalalStreetTalks
      - CryptoCurrency
      - Forex
  twitter:
    # Phase 24.22 — Apify-backed Twitter / X scraping. Off by default.
    # Flip `enabled: true` AND set APIFY_TOKEN in .env to activate.
    # Cost: at apidojo/tweet-scraper pricing, 100 tickers x 30 tweets/day
    # is roughly USD 22-36 / month. Tighten `tweets_per_ticker` to lower
    # spend; set `lookback_hours: 6` for intraday-only sweeps.
    enabled: false
    actor_id: apidojo/tweet-scraper
    tweets_per_ticker: 30
    lookback_hours: 24
    batch_size: 8           # tickers per actor run (amortises warm-up cost)
    lang: en                # set to null for multilingual (more results, more noise)
    cashtags: true          # search $TICKER
    hashtags: true          # search #TICKER
    sleep_between: 1.0      # seconds between actor batches

storage:
  hot_root: C:\Omni_Stocks\data
  drive_root: Z:\
  archive_after_days: 60
