# Multi-LLM routing rules. Edit weights/fallbacks here without touching code.

version: 1

backends:
  finbert:
    type: finbert
    model: ProsusAI/finbert
    device: auto              # "cuda" | "cpu" | "auto"
    batch_size: 32
    enabled: true

  ollama_qwen:
    type: ollama
    base_url: ${OLLAMA_BASE_URL}
    model: qwen2.5:7b-instruct-q5_K_M
    timeout_s: 120
    enabled: true

  ollama_phi:
    type: ollama
    base_url: ${OLLAMA_BASE_URL}
    model: phi3.5:mini
    timeout_s: 60
    enabled: true

  openrouter_llama70b:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: meta-llama/llama-3.1-70b-instruct:free
    rate_limit:
      rpm: 18
      rpd: 180
    enabled: true

  openrouter_gemma:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: google/gemma-2-9b-it:free
    rate_limit:
      rpm: 18
      rpd: 180
    enabled: true

  openrouter_minimax_free:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: minimax/minimax-m2.5:free
    timeout_s: 90
    rate_limit:
      rpm: 18      # OpenRouter free tier caps at 20 rpm; 18 leaves headroom
      rpd: 200
    enabled: true

  # Phase 24.18 — Nemotron chat fallback. MiniMax M2.5 free is intermittently
  # rate-limited / down upstream; Nemotron-3-Super-120B (MoE, 12B active) is
  # the strongest free chat model on OpenRouter and works as a drop-in.
  openrouter_nemotron_chat:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/nemotron-3-super-120b-a12b:free
    timeout_s: 90
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  # Phase 24.18 — smaller Nemotron variant, faster on short prompts
  openrouter_nemotron_nano:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/nemotron-nano-9b-v2:free
    timeout_s: 60
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  groq_llama70b:
    type: groq
    api_key_env: GROQ_API_KEY
    model: llama-3.3-70b-versatile
    timeout_s: 60
    rate_limit:
      rpm: 28      # free tier ~30 rpm; leave headroom
      rpd: 14000
    enabled: true

  groq_llama8b:
    type: groq
    api_key_env: GROQ_API_KEY
    model: llama-3.1-8b-instant
    timeout_s: 30
    rate_limit:
      rpm: 28
      rpd: 14000
    enabled: true

  gemini_flash:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-2.0-flash
    timeout_s: 60
    rate_limit:
      rpm: 13      # free tier 15 rpm; leave headroom
      rpd: 1400
    enabled: true

  gemini_flash_lite:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-2.0-flash-lite
    timeout_s: 30
    rate_limit:
      rpm: 28
      rpd: 1400
    enabled: true

  cortex_sentiment:
    type: cortex
    connection_env: SNOWFLAKE_CONNECTION_NAME
    function: SNOWFLAKE.CORTEX.SENTIMENT
    enabled: true

  cortex_claude:
    type: cortex
    connection_env: SNOWFLAKE_CONNECTION_NAME
    function: SNOWFLAKE.CORTEX.COMPLETE
    model: claude-3-5-sonnet
    enabled: true

  cortex_llama405:
    type: cortex
    connection_env: SNOWFLAKE_CONNECTION_NAME
    function: SNOWFLAKE.CORTEX.COMPLETE
    model: llama3.1-405b
    enabled: true

  # ---- Embedding backends -------------------------------------------------
  # NVIDIA Llama-Nemotron-Embed-VL 1B is FREE on OpenRouter.
  # Use for S3 (news embeddings) and any future RAG-style retrieval.
  # 1024-dim, multilingual, vision+language (we only use text here).
  openrouter_nemotron_embed:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/llama-nemotron-embed-vl-1b-v2:free
    endpoint: /api/v1/embeddings
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

# Task -> backend chain. Primary tried first, fallback if primary errors / rate limits.
tasks:
  sentiment_per_article:
    primary: [finbert]
    fallback: []
    cache_ttl_days: 30

  theme_extraction:
    primary: [groq_llama70b]
    fallback: [gemini_flash, ollama_qwen, openrouter_llama70b, ollama_phi]
    cache_ttl_days: 7

  bulk_classification:
    primary: [groq_llama8b]
    fallback: [gemini_flash_lite, ollama_phi, ollama_qwen]
    cache_ttl_days: 30

  daily_market_synthesis:
    # cortex_claude demoted to fallback because snowflake-connector-python
    # isn't always installed; the router was logging 2 warnings per call.
    # Promote groq_llama70b which is fast + Llama 3.1 70B class.
    primary: [groq_llama70b]
    fallback: [openrouter_nemotron_chat, gemini_flash, cortex_claude, cortex_llama405, openrouter_llama70b]
    cache_ttl_days: 1
    cost_class: paid

  signal_explanation:
    primary: [openrouter_minimax_free]
    fallback: [groq_llama70b, openrouter_nemotron_chat, gemini_flash, ollama_qwen, openrouter_gemma, openrouter_nemotron_nano, cortex_claude]
    cache_ttl_days: 1

  # Phase 24.15 — RAG-grounded signal explanation. Same backend chain but
  # called by omni.llm.rag.pipeline.RAGPipeline which retrieves news from
  # the local Qdrant store, builds a citation-enforcing prompt, and runs
  # the output through the anti-hallucination validator.
  # Tunables consumed by RAGPipeline:
  #   rag.retrieval.doc_types       which Qdrant collections to search
  #   rag.retrieval.date_window_days  recency filter (-N days .. today)
  #   rag.retrieval.top_k           number of chunks fed to the LLM
  #   rag.validators.grounding_min  sentence-cosine threshold for is_safe
  signal_explanation_rag:
    # MiniMax M2.5 (free) is currently the strongest free OpenRouter model
    # by benchmarks (SWE-Bench 80.2%, BrowseComp 76.3%, 197K context) and
    # has reasoning support — well-suited to citation-heavy RAG outputs.
    # groq_llama70b kept as fast fallback (~1-3s vs M2.5 ~3-5s).
    primary: [openrouter_minimax_free]
    fallback: [groq_llama70b, openrouter_nemotron_chat, gemini_flash, openrouter_llama70b, ollama_qwen, cortex_claude]
    cache_ttl_days: 1
    cost_class: free
    rag:
      embedder: nemotron
      reranker: bge-reranker-base
      retrieval:
        doc_types: [news]
        date_window_days: 14
        top_k: 5
      validators:
        grounding_min: 0.55
        require_citations: true
        strip_unsupported_numbers: true

  cross_validation:
    primary: [gemini_flash]
    fallback: [groq_llama70b, openrouter_llama70b, openrouter_gemma, ollama_qwen]
    cache_ttl_days: 7

cache:
  backend: diskcache
  path: data/cache/llm
  size_limit_gb: 5

global:
  default_timeout_s: 60
  default_retries: 2
  log_level: INFO
