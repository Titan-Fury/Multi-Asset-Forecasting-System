# Multi-LLM routing rules. Edit weights/fallbacks here without touching code.

version: 1

backends:
  finbert:
    type: finbert
    model: ProsusAI/finbert
    device: auto              # "cuda" | "cpu" | "auto"
    batch_size: 32
    enabled: true

  ollama_qwen:
    type: ollama
    base_url: ${OLLAMA_BASE_URL}
    model: qwen2.5:7b-instruct-q5_K_M
    timeout_s: 120
    enabled: true

  ollama_phi:
    type: ollama
    base_url: ${OLLAMA_BASE_URL}
    model: phi3.5:mini
    timeout_s: 60
    enabled: true

  openrouter_llama70b:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: meta-llama/llama-3.1-70b-instruct:free
    rate_limit:
      rpm: 18
      rpd: 180
    enabled: true

  openrouter_gemma:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    # Phase 24.21 — gemma-2-9b-it:free was removed from OpenRouter (404 in
    # logs). Switched to gemma-3-12b-it:free which is currently available.
    model: google/gemma-3-12b-it:free
    rate_limit:
      rpm: 18
      rpd: 180
    enabled: true

  openrouter_minimax_free:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: minimax/minimax-m2.5:free
    timeout_s: 90
    rate_limit:
      # Phase 24.21 — was 18 rpm but the upstream Minimax free tier is
      # aggressively gated and we were getting "rate-limited upstream" 35x
      # per run. Drop to 3 rpm so the local limiter blocks before we ever
      # hit the upstream 429.
      rpm: 3
      rpd: 200
    enabled: true

  # Phase 24.18 — Nemotron chat = NEW PRIMARY for finance / signal explanation.
  # NVIDIA Nemotron-3-Super-120B (MoE, 12B active) is the strongest free
  # general-purpose reasoner currently on OpenRouter (262K ctx, no daily 50-req
  # cap that MiniMax M2.5 free tier imposes), and it handles finance-domain
  # reasoning well in practice. MiniMax is kept as fallback because it is
  # often rate-limited upstream (HTTP 429 "Provider returned error").
  openrouter_nemotron_chat:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/nemotron-3-super-120b-a12b:free
    timeout_s: 90
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  # Phase 24.18 — Nemotron-3-Nano-Omni Reasoning. Faster than Super-120B for
  # short-context tasks; reasoning variant (chain-of-thought enabled).
  openrouter_nemotron_omni_reason:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    timeout_s: 60
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  # Phase 24.18 — smaller Nemotron variant, faster on short prompts
  openrouter_nemotron_nano:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/nemotron-nano-9b-v2:free
    timeout_s: 60
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  # Qwen3-Next-80B (MoE, 3B active) — strong general/finance reasoner with
  # 262K ctx. Competitive with Nemotron-3-Super on benchmark reasoning.
  openrouter_qwen3_next_80b:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: qwen/qwen3-next-80b-a3b-instruct:free
    timeout_s: 90
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  # DeepSeek V4 Flash — DeepSeek consistently scores high on financial
  # reasoning + math benchmarks, and Flash is the fast variant. 256K ctx.
  openrouter_deepseek_v4_flash:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: deepseek/deepseek-v4-flash:free
    timeout_s: 60
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  # OpenAI gpt-oss-120b — OpenAI open-weights flagship; useful as a
  # capability-tier fallback when the others are rate-limited.
  openrouter_gpt_oss_120b:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: openai/gpt-oss-120b:free
    timeout_s: 90
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

  groq_llama70b:
    type: groq
    api_key_env: GROQ_API_KEY
    model: llama-3.3-70b-versatile
    timeout_s: 60
    rate_limit:
      rpm: 28      # free tier ~30 rpm; leave headroom
      rpd: 14000
    enabled: true

  groq_llama8b:
    type: groq
    api_key_env: GROQ_API_KEY
    model: llama-3.1-8b-instant
    timeout_s: 30
    rate_limit:
      # Phase 24.21 — was 28 rpm but bulk_classification bursts at this rate
      # blow through Groq's 6000 TPM cap (each prompt is ~250 tokens; 28 rpm
      # = ~7000 TPM). Drop to 10 rpm so we stay comfortably under the TPM
      # ceiling and stop spamming "rate-limited" warnings on every run.
      rpm: 10
      rpd: 14000
    enabled: true

  gemini_flash:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-2.0-flash
    timeout_s: 60
    rate_limit:
      rpm: 13      # free tier 15 rpm; leave headroom
      rpd: 1400
    enabled: true

  gemini_flash_lite:
    type: gemini
    api_key_env: GEMINI_API_KEY
    model: gemini-2.0-flash-lite
    timeout_s: 30
    rate_limit:
      # Phase 24.21 — same TPM concern as groq_llama8b above. Drop from 28
      # rpm to 10 rpm; bulk_classification was hitting Gemini free-tier RPM
      # ceilings ~33x per run.
      rpm: 10
      rpd: 1400
    enabled: true

  cortex_sentiment:
    type: cortex
    connection_env: SNOWFLAKE_CONNECTION_NAME
    function: SNOWFLAKE.CORTEX.SENTIMENT
    enabled: true

  cortex_claude:
    type: cortex
    connection_env: SNOWFLAKE_CONNECTION_NAME
    function: SNOWFLAKE.CORTEX.COMPLETE
    model: claude-3-5-sonnet
    enabled: true

  cortex_llama405:
    type: cortex
    connection_env: SNOWFLAKE_CONNECTION_NAME
    function: SNOWFLAKE.CORTEX.COMPLETE
    model: llama3.1-405b
    enabled: true

  # ---- Embedding backends -------------------------------------------------
  # NVIDIA Llama-Nemotron-Embed-VL 1B is FREE on OpenRouter.
  # Use for S3 (news embeddings) and any future RAG-style retrieval.
  # 1024-dim, multilingual, vision+language (we only use text here).
  openrouter_nemotron_embed:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    model: nvidia/llama-nemotron-embed-vl-1b-v2:free
    endpoint: /api/v1/embeddings
    rate_limit:
      rpm: 18
      rpd: 200
    enabled: true

# Task -> backend chain. Primary tried first, fallback if primary errors / rate limits.
tasks:
  sentiment_per_article:
    primary: [finbert]
    fallback: []
    cache_ttl_days: 30

  theme_extraction:
    primary: [groq_llama70b]
    fallback: [gemini_flash, ollama_qwen, openrouter_llama70b, ollama_phi]
    cache_ttl_days: 7

  bulk_classification:
    primary: [groq_llama8b]
    fallback: [gemini_flash_lite, ollama_phi, ollama_qwen]
    cache_ttl_days: 30

  daily_market_synthesis:
    # Nemotron-3-Super promoted to primary (free, MoE 120B/12B-active, 262K ctx,
    # no per-day 50-req cap that bites MiniMax). Groq Llama-3.3-70B is a
    # very fast secondary; MiniMax kept further down because it intermittently
    # 429s upstream.
    primary: [openrouter_nemotron_chat]
    fallback: [groq_llama70b, openrouter_qwen3_next_80b, openrouter_deepseek_v4_flash, openrouter_minimax_free, gemini_flash, openrouter_gpt_oss_120b, cortex_claude, cortex_llama405, openrouter_llama70b]
    cache_ttl_days: 1
    cost_class: paid

  signal_explanation:
    primary: [openrouter_nemotron_chat]
    fallback: [openrouter_qwen3_next_80b, openrouter_deepseek_v4_flash, openrouter_minimax_free, groq_llama70b, openrouter_nemotron_omni_reason, gemini_flash, openrouter_gpt_oss_120b, ollama_qwen, openrouter_gemma, openrouter_nemotron_nano, cortex_claude]
    cache_ttl_days: 1

  # Phase 24.15 — RAG-grounded signal explanation. Same backend chain but
  # called by omni.llm.rag.pipeline.RAGPipeline which retrieves news from
  # the local Qdrant store, builds a citation-enforcing prompt, and runs
  # the output through the anti-hallucination validator.
  # Tunables consumed by RAGPipeline:
  #   rag.retrieval.doc_types       which Qdrant collections to search
  #   rag.retrieval.date_window_days  recency filter (-N days .. today)
  #   rag.retrieval.top_k           number of chunks fed to the LLM
  #   rag.validators.grounding_min  sentence-cosine threshold for is_safe
  signal_explanation_rag:
    # User preference (Phase 24.18): Nemotron PRIMARY (best free reasoner for
    # finance), MiniMax M2.5 demoted to fallback because it is constantly
    # rate-limited upstream (429s). Qwen3-Next-80B and DeepSeek-V4-Flash are
    # added as additional strong free reasoners ahead of MiniMax.
    primary: [openrouter_nemotron_chat]
    fallback: [openrouter_qwen3_next_80b, openrouter_deepseek_v4_flash, openrouter_minimax_free, groq_llama70b, openrouter_nemotron_omni_reason, gemini_flash, openrouter_gpt_oss_120b, openrouter_llama70b, ollama_qwen, cortex_claude]
    cache_ttl_days: 1
    cost_class: free
    rag:
      embedder: nemotron
      reranker: bge-reranker-base
      retrieval:
        doc_types: [news]
        date_window_days: 14
        top_k: 5
      validators:
        grounding_min: 0.55
        require_citations: true
        strip_unsupported_numbers: true

  cross_validation:
    primary: [gemini_flash]
    fallback: [groq_llama70b, openrouter_llama70b, openrouter_gemma, ollama_qwen]
    cache_ttl_days: 7

cache:
  backend: diskcache
  path: data/cache/llm
  size_limit_gb: 5

global:
  default_timeout_s: 60
  default_retries: 2
  log_level: INFO
